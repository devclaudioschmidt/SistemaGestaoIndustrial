<!DOCTYPE html>
<!--
  usuarios.html
  =============================================================================
  Tela de gerenciamento de usuários (acesso exclusivo do master).
  CRUD completo: criar, editar, ativar/desativar usuários.
  Depende de: global.css, usuarios.css, ui-controller.js, usuarios-controller.js
  =============================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gerenciamento de Usuários - Sistema de Gestão Industrial Auxtrat" />
  <meta name="theme-color" content="#1a73e8" />
  <title>Usuários - Auxtrat Gestão Industrial</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="frontEnd/css/global.css" />
  <link rel="stylesheet" href="frontEnd/css/usuarios.css" />
</head>
<body>

  <!-- TOPBAR FIXA -->
  <header class="usuarios-topbar">
    <div class="topbar-left">
      <img src="frontEnd/img/logoAuxtrat-card.png" alt="Auxtrat" class="topbar-logo" />
      <span class="topbar-app-name">Sistema de Gestão Industrial</span>
    </div>
    <div class="topbar-right">
      <span id="usuarios-user-info" class="topbar-user-info"></span>
      <button id="usuarios-logout" class="btn-logout">Sair</button>
    </div>
  </header>
  <!-- /topbar -->

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="usuarios-main">

    <!-- Cabeçalho da página com título e botão novo usuário -->
    <section class="usuarios-header">
      <div class="header-left">
        <h1 class="page-title">Usuários do Sistema</h1>
        <p class="page-subtitle text-muted">Gerencie os usuários e suas permissões de acesso</p>
      </div>
      <button id="btn-novo-usuario" class="btn-primary btn-novo-usuario">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Novo Usuário
      </button>
    </section>

    <!-- Tabela de usuários -->
    <section class="usuarios-table-section">
      <div id="usuarios-table-wrapper" class="table-wrapper card-google">
        <!-- Loading spinner -->
        <div id="usuarios-loading" class="table-loading">
          <div class="loading-spinner"></div>
          <p>Carregando usuários...</p>
        </div>
        <!-- Estado vazio (sem usuários cadastrados) -->
        <div id="usuarios-empty" class="table-empty" style="display:none">
          <p class="text-muted">Nenhum usuário cadastrado ainda.</p>
        </div>
        <!-- Tabela (oculta inicialmente, exibida via JS quando houver dados) -->
        <table id="usuarios-table" class="usuarios-table" style="display:none">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Cargo</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usuarios-tbody"></tbody>
        </table>
      </div>
    </section>

  </main>
  <!-- /conteúdo principal -->

  <!-- MODAL: Novo / Editar Usuário -->
  <div id="modal-usuario" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-container">
      <!-- Header do modal -->
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Novo Usuário</h2>
        <button id="modal-close" class="modal-close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <!-- Formulário do modal -->
      <form id="form-usuario" class="modal-body" novalidate>
        <input type="hidden" id="usuario-uid" />

        <!-- Campo: Nome -->
        <div class="input-group">
          <label for="usuario-nome" class="input-label">Nome completo</label>
          <div class="input-wrapper">
            <input type="text" id="usuario-nome" class="input-field" placeholder="Ex: João Silva" required />
          </div>
          <span id="nome-error" class="field-error" role="alert"></span>
        </div>

        <!-- Campo: E-mail -->
        <div class="input-group">
          <label for="usuario-email" class="input-label">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="usuario-email" class="input-field" placeholder="Ex: joao@email.com" inputmode="email" required />
          </div>
          <span id="email-error" class="field-error" role="alert"></span>
        </div>

        <!-- Campo: Senha (com toggle de visibilidade e helper text na edição) -->
        <div class="input-group">
          <label for="usuario-senha" class="input-label">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="usuario-senha" class="input-field" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            <button type="button" class="toggle-password" aria-label="Mostrar senha" tabindex="-1">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
          <span id="senha-error" class="field-error" role="alert"></span>
          <p id="senha-helper" class="field-helper">Deixe em branco para manter a senha atual (apenas na edição)</p>
        </div>

        <!-- Campo: Cargo (select) -->
        <div class="input-group">
          <label for="usuario-cargo" class="input-label">Tipo de conta</label>
          <div class="input-wrapper">
            <select id="usuario-cargo" class="input-field input-select" required>
              <option value="">Selecione um cargo...</option>
              <option value="gerente">Gerente</option>
              <option value="vendas">Vendas</option>
              <option value="compras">Compras</option>
              <option value="financeiro">Financeiro</option>
              <option value="operadores">Operador</option>
            </select>
          </div>
          <span id="cargo-error" class="field-error" role="alert"></span>
        </div>
      </form>

      <!-- Footer do modal: cancelar e salvar -->
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-cancel">Cancelar</button>
        <button id="modal-save" class="btn-primary btn-save">
          <span class="spinner"></span>
          <span class="btn-text">Criar Usuário</span>
        </button>
      </div>
    </div>
  </div>
  <!-- /modal usuário -->

  <!-- MODAL: Confirmação (ativar/desativar) -->
  <div id="modal-confirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-container modal-confirm">
      <div class="modal-header">
        <h2 id="confirm-title" class="modal-title">Confirmar Ação</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message" class="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="btn-cancel">Cancelar</button>
        <button id="confirm-action" class="btn-primary btn-danger">
          <span class="spinner"></span>
          <span class="btn-text">Confirmar</span>
        </button>
      </div>
    </div>
  </div>
  <!-- /modal confirmação -->

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <!-- Módulos do Sistema -->
  <script src="frontEnd/js/firebase-core.js"></script>
  <script src="frontEnd/js/auth-service.js"></script>
  <script src="frontEnd/js/ui-controller.js"></script>
  <script src="frontEnd/js/usuarios-controller.js"></script>

</body>
</html>
